<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Physics Flashcard</title>
  <!-- This links our HTML to our CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div class="card-container">
    <!-- We give this an ID so JavaScript can find it later -->
    <div class="card" id="flashcard">
      
      <div class="card-front">
        <h2>Concept Check</h2>
        <p>What is the primary function of the collimator in an X-ray tube?</p>
      </div>
      
      <div class="card-back">
        <h2>Answer</h2>
        <p>It restricts the size and shape of the X-ray beam to reduce patient dose and improve image contrast.</p>
      </div>
      
    </div>
  </div>

  <!-- This links our HTML to our JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
